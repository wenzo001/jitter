[package]
name = "jitter-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Jitter 的核心逻辑：调度、执行、日志与条件判断"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
percent-encoding.workspace = true
base64.workspace = true
http.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

# 升级检查在环境代理不可用时回退到 Windows 系统代理（注册表）。
# windows-sys：AC 电源状态（GetSystemPowerStatus）、本机 IPv4（GetAdaptersAddresses）、
# 防休眠（SetThreadExecutionState）、启动失败时的用户提示框（MessageBoxW）。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS / Linux：getifaddrs 枚举本机 IPv4。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
