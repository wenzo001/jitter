[workspace]
resolver = "2"
members = ["crates/jitter-core", "crates/jitter-app"]

[workspace.package]
version = "2.1.14"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
url = "2"
percent-encoding = "2"
base64 = "0.22"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "fs", "process", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
axum = "0.7"
include_dir = "0.7"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# 必须 unwind：panic=abort 会让任意一处 panic 直接杀掉整个进程。
# 改成 unwind 后，单个请求里的 panic 只结束那一次连接，其余功能照常。
panic = "unwind"
strip = true
