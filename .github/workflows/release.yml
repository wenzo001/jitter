name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: "Gate: both sides green"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust core tests
        working-directory: rust
        run: cargo test -p jitter-core
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            bin: jitter.exe
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: macos
            arch: arm64
            bin: jitter
            target: aarch64-apple-darwin
          # macos-13（Intel）运行器已退役：x64 由 arm64 机器交叉编译。
          - os: macos-latest
            platform: macos
            arch: x64
            bin: jitter
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            platform: linux
            arch: x64
            bin: jitter
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            bin: jitter
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build release binary
        working-directory: rust
        run: cargo build --release -p jitter-app --target ${{ matrix.target }}

      # 资产名必须保持 jitter-<platform>-<arch>.zip：
      # 内置升级逻辑按这个名字找当前平台的安装包。
      - name: Package zip (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.bin }}" "staging/${{ matrix.bin }}"
          chmod +x "staging/${{ matrix.bin }}"
          asset="jitter-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          (cd staging && zip -r "../$asset" .)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" | tee "$asset.sha256"
          else
            shasum -a 256 "$asset" | tee "$asset.sha256"
          fi
          mkdir -p dist && mv "$asset" "$asset.sha256" dist/

      - name: Package zip (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $asset = "jitter-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Force staging, dist | Out-Null
          Copy-Item "rust/target/${{ matrix.target }}/release/${{ matrix.bin }}" "staging/${{ matrix.bin }}"
          Compress-Archive -Path "staging/*" -DestinationPath $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File "$asset.sha256" -Encoding ascii
          Move-Item $asset, "$asset.sha256" -Destination dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
