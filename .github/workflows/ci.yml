name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test jitter-core
        working-directory: rust
        run: cargo test -p jitter-core --jobs 2

  frontend:
    name: Vue frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bun 在这里只是前端工程的包管理器/构建工具，与已移除的 TS 后端无关。
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: bun run typecheck
      - name: Unit tests
        working-directory: web
        run: bun run test
      - name: Build
        working-directory: web
        run: bun run build
